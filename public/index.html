<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next Workout</title>
<style>
  :root {
    --bg: #1c1c1c;
    --fg: #e8e6e1;
    --muted: #9a978f;
    --rule: #3a3a38;
    --accent: #d8d4cb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding: 28px 20px 60px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  .tabs { display: flex; gap: 4px; margin: 0 0 22px; border-bottom: 1px solid var(--rule); }
  .tab {
    background: none; border: none; color: var(--muted); font: inherit;
    font-size: 14px; font-weight: 600; padding: 8px 14px 11px; cursor: pointer;
    position: relative; display: flex; align-items: center; gap: 7px;
  }
  .tab.active { color: var(--fg); }
  .tab.active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--fg);
  }
  .badge {
    font-size: 9.5px; font-weight: 700; letter-spacing: .06em;
    background: var(--fg); color: var(--bg); padding: 2px 5px; border-radius: 3px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 27px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em;
  }
  .subtitle { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-weight: 700; font-size: 13.5px;
    padding: 0 16px 10px 0; border-bottom: 1px solid var(--rule); vertical-align: bottom;
  }
  tbody td { padding: 16px 16px 16px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  tbody td:last-child, thead th:last-child { padding-right: 0; }
  .ex { font-weight: 600; }
  .muted { color: var(--muted); }
  .footer { margin-top: 26px; display: grid; gap: 9px; font-size: 13.5px; }
  .footer .lbl { color: var(--accent); font-weight: 700; }
  .stamp { margin-top: 24px; color: var(--muted); font-size: 12px; }
  /* Next Workout | Coach switch — tabbed navigation */
  .site-switch {
    display: inline-flex; margin: -12px 0 18px; padding: 2px;
    border: 1px solid var(--rule); border-radius: 8px;
    background: transparent;
  }
  .site-switch a, .site-switch button {
    background: none; border: none; font: inherit;
    color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600;
    padding: 6px 12px; border-radius: 6px; white-space: nowrap; cursor: pointer;
  }
  .site-switch a.active, .site-switch button.active { background: var(--rule); color: var(--fg); }
  #pane-coach {
    width: 100%;
    height: calc(100dvh - 90px);
    display: flex;
  }
  #coach-frame {
    width: 100%;
    height: 100%;
    border: 1px solid var(--rule);
    border-radius: 12px;
    background: #0d0f12;
  }
  body.coach-mode {
    padding-bottom: 10px;
    overflow: hidden;
  }
  @media (max-width: 620px) {
    body.coach-mode {
      padding: 10px 10px 0;
      height: 100dvh;
      overflow: hidden;
    }
    body.coach-mode .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    body.coach-mode #pane-coach {
      flex: 1;
      height: auto;
    }
    body.coach-mode #coach-frame {
      border-radius: 8px;
    }
  }
  .warmup-card-row td {
    padding: 8px 0 14px;
    border-bottom: 1px dashed var(--rule);
  }
  .warmup-card-row td::before {
    display: none !important;
  }
  .warmup-card {
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid var(--rule);
    border-left: 3px solid #eab308;
    border-radius: 8px;
    padding: 10px 14px 12px;
    margin: 4px 0 6px;
  }
  .warmup-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .warmup-badge {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .06em;
    background: #eab308;
    color: #111;
    padding: 2px 5px;
    border-radius: 3px;
  }
  .warmup-title {
    font-weight: 700;
    color: var(--fg);
  }
  .warmup-count {
    color: var(--muted);
    font-size: 11.5px;
    margin-left: auto;
  }
  .warmup-mini-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .warmup-mini-table td {
    padding: 4px 12px 4px 0 !important;
    border: none !important;
    vertical-align: baseline;
    display: table-cell !important;
    width: auto !important;
  }
  .warmup-mini-table td::before {
    display: none !important;
  }
  .warmup-mini-table .wm-wt {
    font-weight: 600;
    color: var(--fg);
    white-space: nowrap;
    width: 22%;
  }
  .warmup-mini-table .wm-reps {
    color: var(--accent);
    white-space: nowrap;
    width: 16%;
  }
  .warmup-mini-table .wm-bd {
    width: 24%;
  }
  .warmup-mini-table .wm-note {
    font-style: italic;
  }

  /* Note card & pill badge styles */
  .note-card {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 8px 10px;
    margin: 2px 0;
    font-size: 13px;
    line-height: 1.4;
  }
  .note-card-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }
  .note-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.02em;
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
  }
  .pill-rest {
    background: rgba(148, 163, 184, 0.15);
    color: #cbd5e1;
    border: 1px solid rgba(148, 163, 184, 0.3);
  }
  .pill-status.pill-advanced {
    background: rgba(34, 197, 94, 0.18);
    color: #4ade80;
    border: 1px solid rgba(34, 197, 94, 0.4);
  }
  .pill-status.pill-hold {
    background: rgba(234, 179, 8, 0.15);
    color: #facc15;
    border: 1px solid rgba(234, 179, 8, 0.35);
  }
  .pill-status.pill-retreat {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.35);
  }
  .pill-tag {
    background: rgba(255, 255, 255, 0.06);
    color: var(--muted);
    border: 1px solid var(--rule);
  }
  .note-card-cues {
    margin: 4px 0 0;
    padding-left: 18px;
    list-style-type: disc;
    color: var(--fg);
  }
  .note-card-cues li {
    margin-bottom: 3px;
  }
  .note-card-cues li:last-child {
    margin-bottom: 0;
  }
  .note-card-history {
    margin-top: 6px;
    padding-top: 5px;
    border-top: 1px dotted var(--rule);
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.35;
  }
  .note-card-history .lbl-hist {
    margin-right: 4px;
  }

  .ex.has-img {
    cursor: pointer;
    text-decoration: underline dotted color-mix(in srgb, var(--muted) 70%, transparent);
    text-underline-offset: 3px;
  }
  .ex.has-img:hover { color: var(--accent); }
  .ex.has-img::after {
    content: " ↗";
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
  }
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0,0,0,.78);
    padding: 24px 16px;
    align-items: center;
    justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox-card {
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 10px;
    max-width: min(720px, 100%);
    max-height: 92vh;
    overflow: auto;
    padding: 16px 16px 14px;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  .lightbox-card h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    margin: 0 0 10px;
    font-weight: 700;
  }
  .lightbox-card img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 6px;
    background: #111;
  }
  .lightbox-hint {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 12px;
  }
  @media (max-width: 620px) {
    body { font-size: 14px; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr { border-bottom: 1px solid var(--rule); padding: 14px 0; }
    tbody td { border: none; padding: 2px 0; }
    tbody td::before { content: attr(data-l) "  "; color: var(--muted); font-size: 12px; }
    tbody td.ex::before { content: ""; }
    tbody td.ex { font-size: 16px; margin-bottom: 4px; }
    tbody td[data-l="Note"]::before { display: none !important; }
    tbody td[data-l="Note"] { padding-top: 4px; }
    tbody tr.warmup-card-row { border-bottom: none; padding: 4px 0 8px; }
    tbody tr.warmup-card-row td { padding: 0; }
    tbody tr.warmup-card-row td::before { display: none !important; }
    .warmup-mini-table tr {
      display: flex !important;
      flex-wrap: wrap;
      gap: 3px 10px;
      padding: 6px 0 !important;
      border-bottom: 1px dotted rgba(255, 255, 255, 0.08) !important;
    }
    .warmup-mini-table tr:last-child {
      border-bottom: none !important;
    }
    .warmup-mini-table td {
      padding: 0 !important;
    }
    .warmup-mini-table .wm-wt { width: auto; font-size: 13.5px; }
    .warmup-mini-table .wm-reps { width: auto; font-weight: 600; font-size: 13.5px; }
    .warmup-mini-table .wm-bd { width: auto; font-size: 12.5px; }
    .warmup-mini-table .wm-note { width: 100%; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap" id="main-wrap">
  <!-- Next Workout | Coach switch -->
  <nav class="site-switch">
    <button type="button" class="active" id="tab-btn-workout" aria-current="page">🏋️ Next Workout</button>
    <button type="button" id="tab-btn-coach">💬 Coach</button>
  </nav>

  <div id="pane-workout">
    <div class="tabs" id="tabs"></div>
    <h1 id="title">Loading…</h1>
    <p class="subtitle" id="subtitle"></p>
    <table>
      <thead>
        <tr><th>Exercise</th><th>Weight</th><th>Sets × Target</th><th>Weight breakdown</th><th>Note</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="footer" id="footer"></div>
    <div class="stamp" id="stamp"></div>
  </div>

  <div id="pane-coach" style="display: none;">
    <iframe id="coach-frame" title="Coach Chat" allow="clipboard-read; clipboard-write; camera"></iframe>
  </div>
</div>


<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-title" hidden>
  <div class="lightbox-card">
    <h2 id="lightbox-title"></h2>
    <img id="lightbox-img" alt="">
    <p class="lightbox-hint">Tap outside or press Esc to close</p>
  </div>
</div>

<script>
// No inline prescription fallback: showing stale weights in the gym is worse than showing none.
const FALLBACK = {};

function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

let DATA = FALLBACK;
let active = null;

// Optional form diagrams. Keys are normalized exercise names (lowercase, no stars/emoji).
// Prefer row.image from Notion JSON when present; else fall back to this map.
const EXERCISE_IMAGES = {
  "high-cable 2-arm row": "/exercises/high-cable-2-arm-row.jpg",
  "high cable 2-arm row": "/exercises/high-cable-2-arm-row.jpg",
  "seated cable row": "/exercises/high-cable-2-arm-row.jpg"
};

function normalizeEx(name){
  return String(name||"")
    .replace(/[⭐*]/g,"")
    .replace(/\s+/g," ")
    .trim()
    .toLowerCase()
    .replace(/[—–-]+/g,"-");
}

function imageFor(exercise, rowImage){
  if(rowImage) return rowImage;
  const n = normalizeEx(exercise);
  if(EXERCISE_IMAGES[n]) return EXERCISE_IMAGES[n];
  // fuzzy: strip parentheticals already partly handled; try startsWith keys
  for(const [k,v] of Object.entries(EXERCISE_IMAGES)){
    if(n.startsWith(k) || k.startsWith(n.split("(")[0].trim())) return v;
  }
  return null;
}

function openLightbox(title, src){
  const box = document.getElementById("lightbox");
  document.getElementById("lightbox-title").textContent = title;
  const img = document.getElementById("lightbox-img");
  img.src = src;
  img.alt = title + " form diagram";
  box.hidden = false;
  box.classList.add("open");
}
function closeLightbox(){
  const box = document.getElementById("lightbox");
  box.classList.remove("open");
  box.hidden = true;
  document.getElementById("lightbox-img").removeAttribute("src");
}
document.getElementById("lightbox").addEventListener("click", e=>{
  if(e.target.id === "lightbox") closeLightbox();
});
document.addEventListener("keydown", e=>{
  if(e.key === "Escape") closeLightbox();
});


// Picks the session whose own `next` flag is true — never by array position or
// hardcoded session name/order, and works for any number of session tabs.
function pickNextKey(d){
  const keys = Object.keys(d);
  const nextKeys = keys.filter(k=>d[k] && d[k].next === true);
  if(nextKeys.length === 1) return nextKeys[0];
  if(nextKeys.length === 0){
    console.warn("[prescription] no session has next:true; falling back to first session:", keys[0]);
  } else {
    console.warn("[prescription] multiple sessions marked next:true:", nextKeys, "— falling back to", nextKeys[0]);
  }
  return nextKeys[0] || keys[0];
}

function orderedKeys(d, nextKey){
  return Object.keys(d).sort((a,b)=>(a===nextKey?-1:0)-(b===nextKey?-1:0));
}

function renderTabs(nextKey){
  const el = document.getElementById("tabs");
  el.innerHTML = orderedKeys(DATA, nextKey).map(k=>{
    const s = DATA[k];
    const badge = k===nextKey ? '<span class="badge">NEXT</span>' : '';
    return `<button class="tab ${k===active?"active":""}" data-k="${k}">${esc(s.session||k)}${badge}</button>`;
  }).join("");
  el.querySelectorAll(".tab").forEach(b=>{
    b.onclick = ()=>{ active = b.dataset.k; renderTabs(nextKey); renderSession(DATA[active]); };
  });
}

function parseNote(raw) {
  if (!raw || typeof raw !== "string") return null;
  let text = raw.trim();

  let rest = "";
  if (text.match(/Rest\s+\d+/i) || text.match(/\d+\s*(?:min|sec)\s+rest/i)) {
    const m = text.match(/Rest\s+(\d+(?:\.\d+)?\s*(?:min|sec|s))/i) || text.match(/(\d+(?:\.\d+)?\s*(?:min|sec|s))\s+rest/i);
    if (m) {
      rest = m[1].replace(/\s+/g, "");
      text = text.replace(m[0], "");
    }
  }

  let status = "";
  let statusType = "";
  const sm = text.match(/\b(ADVANCED(?:\s+to)?\s+\d+(?:\.\d+)?|HOLD\s+\d+(?:\.\d+)?(?:\s+Cal-\d+)?|RETREAT\s+\d+(?:\.\d+)?)/i);
  if (sm) {
    status = sm[1].trim();
    const up = status.toUpperCase();
    if (up.startsWith("ADV")) statusType = "advanced";
    else if (up.startsWith("RET")) statusType = "retreat";
    else statusType = "hold";
    text = text.replace(sm[0], "");
  }

  const tags = [];
  if (/\bsolo\b/i.test(text) && !/\bset 4 solo\b/i.test(text)) {
    tags.push("Solo");
    text = text.replace(/\bsolo\b/gi, "");
  }
  if (/\bstraight sets\b/i.test(text)) {
    tags.push("Straight Sets");
    text = text.replace(/\bstraight sets\b/gi, "");
  }

  text = text.replace(/^\s*[,.—–-]+\s*|\s*[,.—–-]+\s*$/g, "");
  let rawCues = text
    .split(/(?:\.\s+(?=[A-Z0-9])|\s+[—–-]\s+|;\s*)/)
    .map(s => s.trim().replace(/^[,.—–-]+\s*|[,.—–-]+\s*$/g, ""))
    .filter(s => s.length > 2 && !/^(solo|straight sets)$/i.test(s));

  const historyItems = [];
  const cues = [];
  const datePattern = /^(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d+/i;

  rawCues.forEach(c => {
    if (datePattern.test(c) || /\b(?:all-top|improving from|load-match only)\b/i.test(c)) {
      historyItems.push(c);
    } else {
      cues.push(c);
    }
  });

  return { rest, status, statusType, tags, historyItems, cues, raw };
}

function renderNoteHtml(raw) {
  if (!raw) return "";
  const p = parseNote(raw);
  if (!p) return "";
  const badges = [];
  if (p.rest) badges.push(`<span class="note-pill pill-rest">⏱️ ${esc(p.rest)}</span>`);
  if (p.status) badges.push(`<span class="note-pill pill-status pill-${esc(p.statusType)}">${esc(p.status)}</span>`);
  (p.tags || []).forEach(t => badges.push(`<span class="note-pill pill-tag">${esc(t)}</span>`));

  if (!badges.length && !p.cues.length && !p.historyItems.length) {
    return `<div class="note-card"><div class="note-card-text">${esc(raw)}</div></div>`;
  }

  let out = `<div class="note-card">`;
  if (badges.length) {
    out += `<div class="note-card-badges">${badges.join(" ")}</div>`;
  }
  if (p.cues.length) {
    out += `<ul class="note-card-cues">` + p.cues.map(c => `<li>${esc(c)}</li>`).join("") + `</ul>`;
  }
  if (p.historyItems.length) {
    out += `<div class="note-card-history"><span class="lbl-hist">📊</span> ${esc(p.historyItems.join(" · "))}</div>`;
  }
  out += `</div>`;
  return out;
}

function renderSession(d){
  if(!d) return;
  document.getElementById("title").textContent = d.session || "";
  document.getElementById("subtitle").textContent = d.subtitle || "";
  const w = Array.isArray(d.warmup_sets) ? d.warmup_sets : [];
  const baseName = s => String(s||"").split(/[\(—]/)[0].trim().toLowerCase();
  const renderWarmupCard = sets => {
    if (!sets || !sets.length) return "";
    const primaryName = sets[0].exercise || "Warmup";
    return `
      <tr class="warmup-card-row">
        <td colspan="5">
          <div class="warmup-card">
            <div class="warmup-card-header">
              <span class="warmup-badge">WARMUP RAMP</span>
              <span class="warmup-title">${esc(primaryName)}</span>
              <span class="warmup-count">${sets.length} ${sets.length === 1 ? 'set' : 'sets'}</span>
            </div>
            <table class="warmup-mini-table">
              <tbody>
                ${sets.map(s => {
                  const noteParts = [];
                  if (s.note && s.note !== "Warmup") noteParts.push(s.note);
                  if (s.rest && s.rest !== "0") noteParts.push(s.rest);
                  const noteText = noteParts.join(" · ");
                  return `
                    <tr>
                      <td class="wm-wt">${esc(s.weight || "—")}</td>
                      <td class="wm-reps">1 × ${esc(s.reps || "")}</td>
                      <td class="wm-bd muted">${esc(s.breakdown && s.breakdown !== "-" ? s.breakdown : "")}</td>
                      <td class="wm-note muted">${esc(noteText)}</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        </td>
      </tr>`;
  };
  const workingRowHtml = r => {
    const img = imageFor(r.exercise, r.image);
    const exClass = img ? "ex has-img" : "ex";
    const dataImg = img ? ` data-img="${esc(img)}" data-title="${esc(r.exercise)}"` : "";
    return `
    <tr>
      <td class="${exClass}" data-l=""${dataImg}>${esc(r.exercise)}</td>
      <td data-l="Weight">${esc(r.weight)}</td>
      <td data-l="Target">${esc(r.target)}</td>
      <td class="muted" data-l="Breakdown">${esc(r.breakdown)}</td>
      <td data-l="Note">${renderNoteHtml(r.note)}</td>
    </tr>`;
  };
  const usedWarmup = new Set();
  let rowsHtml = (d.rows||[]).map(r=>{
    const rb = baseName(r.exercise);
    const matchedSets = [];
    w.forEach((x,i)=>{
      if(!usedWarmup.has(i) && baseName(x.exercise)===rb){
        usedWarmup.add(i);
        matchedSets.push(x);
      }
    });
    return (matchedSets.length ? renderWarmupCard(matchedSets) : "") + workingRowHtml(r);
  }).join("");
  const leftoverGroups = [];
  w.forEach((x,i)=>{
    if(!usedWarmup.has(i)){
      const bn = baseName(x.exercise);
      let g = leftoverGroups.find(group => group.bn === bn);
      if(!g){
        g = { bn, sets: [] };
        leftoverGroups.push(g);
      }
      g.sets.push(x);
    }
  });
  const leftoverHtml = leftoverGroups.map(g => renderWarmupCard(g.sets)).join("");
  document.getElementById("rows").innerHTML = leftoverHtml + rowsHtml;
  document.querySelectorAll("#rows .ex.has-img").forEach(el=>{
    el.addEventListener("click", ()=> openLightbox(el.dataset.title || el.textContent, el.dataset.img));
  });
  const f = [];
  if(d.tempo)  f.push(`<div><span class="lbl">Tempo:</span> ${esc(d.tempo)}</div>`);
  if(d.warmup && !w.length) f.push(`<div><span class="lbl">Warmup:</span> ${esc(d.warmup)}</div>`);
  if(d.plates) f.push(`<div><span class="lbl">Plates to pull:</span> ${esc(d.plates)}</div>`);
  if(d.effort) f.push(`<div><span class="lbl">Effort:</span> ${esc(d.effort)}</div>`);
  document.getElementById("footer").innerHTML = f.join("");
  document.getElementById("stamp").textContent = d.updated ? "Updated " + d.updated : "";
}

function renderAll(d){
  DATA = d && Object.keys(d).length ? d : FALLBACK;
  const nextKey = pickNextKey(DATA);
  if(!active || !DATA[active]) active = nextKey;
  renderTabs(nextKey);
  renderSession(DATA[active]);
}

function showError(){
  document.getElementById("title").textContent = "Couldn’t load prescription";
  document.getElementById("subtitle").textContent = "Notion didn’t respond. Pull to refresh, or open the Notion page directly — do NOT guess weights.";
  document.getElementById("rows").innerHTML = "";
}
fetch("/api/prescription?nocache=" + Date.now())
  .then(r=>r.ok?r.json():Promise.reject())
  .then(d=>{ if(d && Object.keys(d).length) renderAll(d); else showError(); })
  .catch(showError);

function setAppTab(tab){
  const isCoach = tab === "coach";
  const btnWorkout = document.getElementById("tab-btn-workout");
  const btnCoach = document.getElementById("tab-btn-coach");
  const paneWorkout = document.getElementById("pane-workout");
  const paneCoach = document.getElementById("pane-coach");
  if(!btnWorkout || !btnCoach) return;

  btnWorkout.classList.toggle("active", !isCoach);
  btnCoach.classList.toggle("active", isCoach);
  paneWorkout.style.display = isCoach ? "none" : "";
  paneCoach.style.display = isCoach ? "flex" : "none";
  document.body.classList.toggle("coach-mode", isCoach);

  if(isCoach){
    const frame = document.getElementById("coach-frame");
    if(!frame.src || frame.src === "about:blank" || frame.src.endsWith(window.location.host + "/")){
      frame.src = "/coach/";
    }
    history.replaceState(null, "", "#coach");
  } else {
    history.replaceState(null, "", window.location.pathname + window.location.search);
  }
}

document.getElementById("tab-btn-workout").addEventListener("click", () => setAppTab("workout"));
document.getElementById("tab-btn-coach").addEventListener("click", () => setAppTab("coach"));

window.addEventListener("message", (e) => {
  if(e.data && e.data.tab === "workout") setAppTab("workout");
});

window.addEventListener("hashchange", () => {
  setAppTab(window.location.hash === "#coach" ? "coach" : "workout");
});

if(window.location.hash === "#coach"){
  setAppTab("coach");
}
</script>
