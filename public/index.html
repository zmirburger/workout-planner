<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next Workout</title>
<style>
  :root {
    --bg: #1c1c1c;
    --fg: #e8e6e1;
    --muted: #9a978f;
    --rule: #3a3a38;
    --accent: #d8d4cb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding: 28px 20px 60px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  .tabs { display: flex; gap: 4px; margin: 0 0 22px; border-bottom: 1px solid var(--rule); }
  .tab {
    background: none; border: none; color: var(--muted); font: inherit;
    font-size: 14px; font-weight: 600; padding: 8px 14px 11px; cursor: pointer;
    position: relative; display: flex; align-items: center; gap: 7px;
  }
  .tab.active { color: var(--fg); }
  .tab.active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--fg);
  }
  .badge {
    font-size: 9.5px; font-weight: 700; letter-spacing: .06em;
    background: var(--fg); color: var(--bg); padding: 2px 5px; border-radius: 3px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 27px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em;
  }
  .subtitle { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-weight: 700; font-size: 13.5px;
    padding: 0 16px 10px 0; border-bottom: 1px solid var(--rule); vertical-align: bottom;
  }
  tbody td { padding: 16px 16px 16px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  tbody td:last-child, thead th:last-child { padding-right: 0; }
  .ex { font-weight: 600; }
  .muted { color: var(--muted); }
  .footer { margin-top: 26px; display: grid; gap: 9px; font-size: 13.5px; }
  .footer .lbl { color: var(--accent); font-weight: 700; }
  .stamp { margin-top: 24px; color: var(--muted); font-size: 12px; }
  tr.warmup-row td.wnote { color: var(--muted); font-style: italic; }

  .ex.has-img {
    cursor: pointer;
    text-decoration: underline dotted color-mix(in srgb, var(--muted) 70%, transparent);
    text-underline-offset: 3px;
  }
  .ex.has-img:hover { color: var(--accent); }
  .ex.has-img::after {
    content: " ↗";
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
  }
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0,0,0,.78);
    padding: 24px 16px;
    align-items: center;
    justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox-card {
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 10px;
    max-width: min(720px, 100%);
    max-height: 92vh;
    overflow: auto;
    padding: 16px 16px 14px;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  .lightbox-card h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    margin: 0 0 10px;
    font-weight: 700;
  }
  .lightbox-card img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 6px;
    background: #111;
  }
  .lightbox-hint {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 12px;
  }
  @media (max-width: 620px) {
    body { font-size: 14px; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr { border-bottom: 1px solid var(--rule); padding: 14px 0; }
    tbody td { border: none; padding: 2px 0; }
    tbody td::before { content: attr(data-l) "  "; color: var(--muted); font-size: 12px; }
    tbody td.ex::before { content: ""; }
    tbody td.ex { font-size: 16px; margin-bottom: 4px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <h1 id="title">Loading…</h1>
  <p class="subtitle" id="subtitle"></p>
  <table>
    <thead>
      <tr><th>Exercise</th><th>Weight</th><th>Sets × Target</th><th>Weight breakdown</th><th>Note</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="footer" id="footer"></div>
  <div class="stamp" id="stamp"></div>
</div>


<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-title" hidden>
  <div class="lightbox-card">
    <h2 id="lightbox-title"></h2>
    <img id="lightbox-img" alt="">
    <p class="lightbox-hint">Tap outside or press Esc to close</p>
  </div>
</div>

<script>
// No inline prescription fallback: showing stale weights in the gym is worse than showing none.
const FALLBACK = {};

function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

let DATA = FALLBACK;
let active = null;

// Optional form diagrams. Keys are normalized exercise names (lowercase, no stars/emoji).
// Prefer row.image from Notion JSON when present; else fall back to this map.
const EXERCISE_IMAGES = {
  "high-cable 2-arm row": "/exercises/high-cable-2-arm-row.jpg",
  "high cable 2-arm row": "/exercises/high-cable-2-arm-row.jpg",
  "seated cable row": "/exercises/high-cable-2-arm-row.jpg"
};

function normalizeEx(name){
  return String(name||"")
    .replace(/[⭐*]/g,"")
    .replace(/\s+/g," ")
    .trim()
    .toLowerCase()
    .replace(/[—–-]+/g,"-");
}

function imageFor(exercise, rowImage){
  if(rowImage) return rowImage;
  const n = normalizeEx(exercise);
  if(EXERCISE_IMAGES[n]) return EXERCISE_IMAGES[n];
  // fuzzy: strip parentheticals already partly handled; try startsWith keys
  for(const [k,v] of Object.entries(EXERCISE_IMAGES)){
    if(n.startsWith(k) || k.startsWith(n.split("(")[0].trim())) return v;
  }
  return null;
}

function openLightbox(title, src){
  const box = document.getElementById("lightbox");
  document.getElementById("lightbox-title").textContent = title;
  const img = document.getElementById("lightbox-img");
  img.src = src;
  img.alt = title + " form diagram";
  box.hidden = false;
  box.classList.add("open");
}
function closeLightbox(){
  const box = document.getElementById("lightbox");
  box.classList.remove("open");
  box.hidden = true;
  document.getElementById("lightbox-img").removeAttribute("src");
}
document.getElementById("lightbox").addEventListener("click", e=>{
  if(e.target.id === "lightbox") closeLightbox();
});
document.addEventListener("keydown", e=>{
  if(e.key === "Escape") closeLightbox();
});


// Picks the session whose own `next` flag is true — never by array position or
// hardcoded session name/order, and works for any number of session tabs.
function pickNextKey(d){
  const keys = Object.keys(d);
  const nextKeys = keys.filter(k=>d[k] && d[k].next === true);
  if(nextKeys.length === 1) return nextKeys[0];
  if(nextKeys.length === 0){
    console.warn("[prescription] no session has next:true; falling back to first session:", keys[0]);
  } else {
    console.warn("[prescription] multiple sessions marked next:true:", nextKeys, "— falling back to", nextKeys[0]);
  }
  return nextKeys[0] || keys[0];
}

function orderedKeys(d, nextKey){
  return Object.keys(d).sort((a,b)=>(a===nextKey?-1:0)-(b===nextKey?-1:0));
}

function renderTabs(nextKey){
  const el = document.getElementById("tabs");
  el.innerHTML = orderedKeys(DATA, nextKey).map(k=>{
    const s = DATA[k];
    const badge = k===nextKey ? '<span class="badge">NEXT</span>' : '';
    return `<button class="tab ${k===active?"active":""}" data-k="${k}">${esc(s.session||k)}${badge}</button>`;
  }).join("");
  el.querySelectorAll(".tab").forEach(b=>{
    b.onclick = ()=>{ active = b.dataset.k; renderTabs(nextKey); renderSession(DATA[active]); };
  });
}

function renderSession(d){
  if(!d) return;
  document.getElementById("title").textContent = d.session || "";
  document.getElementById("subtitle").textContent = d.subtitle || "";
  const w = Array.isArray(d.warmup_sets) ? d.warmup_sets : [];
  const baseName = s => String(s||"").split(/[\(—]/)[0].trim().toLowerCase();
  const warmupRowHtml = x => `
    <tr class="warmup-row">
      <td class="ex" data-l="">${esc(x.exercise||"")}</td>
      <td data-l="Weight">${esc(x.weight||"")}</td>
      <td data-l="Target">1 × ${esc(x.reps||"")}</td>
      <td class="muted" data-l="Breakdown">${esc(x.breakdown||"")}</td>
      <td class="muted wnote" data-l="Note">Warmup</td>
    </tr>`;
  const workingRowHtml = r => {
    const img = imageFor(r.exercise, r.image);
    const exClass = img ? "ex has-img" : "ex";
    const dataImg = img ? ` data-img="${esc(img)}" data-title="${esc(r.exercise)}"` : "";
    return `
    <tr>
      <td class="${exClass}" data-l=""${dataImg}>${esc(r.exercise)}</td>
      <td data-l="Weight">${esc(r.weight)}</td>
      <td data-l="Target">${esc(r.target)}</td>
      <td class="muted" data-l="Breakdown">${esc(r.breakdown)}</td>
      <td class="muted" data-l="Note">${esc(r.note)}</td>
    </tr>`;
  };
  const usedWarmup = new Set();
  let rowsHtml = (d.rows||[]).map(r=>{
    const rb = baseName(r.exercise);
    let matched = "";
    w.forEach((x,i)=>{
      if(!usedWarmup.has(i) && baseName(x.exercise)===rb){
        usedWarmup.add(i);
        matched += warmupRowHtml(x);
      }
    });
    return matched + workingRowHtml(r);
  }).join("");
  let leftoverWarmup = "";
  w.forEach((x,i)=>{ if(!usedWarmup.has(i)) leftoverWarmup += warmupRowHtml(x); });
  document.getElementById("rows").innerHTML = leftoverWarmup + rowsHtml;
  document.querySelectorAll("#rows .ex.has-img").forEach(el=>{
    el.addEventListener("click", ()=> openLightbox(el.dataset.title || el.textContent, el.dataset.img));
  });
  const f = [];
  if(d.tempo)  f.push(`<div><span class="lbl">Tempo:</span> ${esc(d.tempo)}</div>`);
  if(d.warmup && !w.length) f.push(`<div><span class="lbl">Warmup:</span> ${esc(d.warmup)}</div>`);
  if(d.plates) f.push(`<div><span class="lbl">Plates to pull:</span> ${esc(d.plates)}</div>`);
  if(d.effort) f.push(`<div><span class="lbl">Effort:</span> ${esc(d.effort)}</div>`);
  document.getElementById("footer").innerHTML = f.join("");
  document.getElementById("stamp").textContent = d.updated ? "Updated " + d.updated : "";
}

function renderAll(d){
  DATA = d && Object.keys(d).length ? d : FALLBACK;
  const nextKey = pickNextKey(DATA);
  if(!active || !DATA[active]) active = nextKey;
  renderTabs(nextKey);
  renderSession(DATA[active]);
}

function showError(){
  document.getElementById("title").textContent = "Couldn’t load prescription";
  document.getElementById("subtitle").textContent = "Notion didn’t respond. Pull to refresh, or open the Notion page directly — do NOT guess weights.";
  document.getElementById("rows").innerHTML = "";
}
fetch("/api/prescription?nocache=" + Date.now())
  .then(r=>r.ok?r.json():Promise.reject())
  .then(d=>{ if(d && Object.keys(d).length) renderAll(d); else showError(); })
  .catch(showError);
</script>
</body>
</html>
